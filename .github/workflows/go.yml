# Build / vet / lint / vulncheck / integration tests on branches and PRs.
#
# The gate definitions live in gates.yml so the release workflow runs the exact
# same set on the tag it publishes; this file only decides when they run here.
#
# CI is enforced strict: any lint or test failure fails the workflow.

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
