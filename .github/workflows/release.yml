name: Release

on:
  push:
    tags:
      - '1.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          go build -buildmode=pie -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o x509-cert-validator-${{ matrix.suffix }} .

      - name: Compress binary
        run: zip -9 x509-cert-validator-${{ matrix.suffix }}.zip x509-cert-validator-${{ matrix.suffix }}

      - name: Generate checksum
        run: sha256sum x509-cert-validator-${{ matrix.suffix }}.zip > x509-cert-validator-${{ matrix.suffix }}.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: x509-cert-validator-${{ matrix.suffix }}
          path: |
            x509-cert-validator-${{ matrix.suffix }}.zip
            x509-cert-validator-${{ matrix.suffix }}.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            x509-cert-validator-*.zip
            x509-cert-validator-*.zip.sha256
